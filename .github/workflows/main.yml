on:
  - pull_request
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - uses: codecov/codecov-action@v7
